sentence=Orientation filter (AHRS) for 9-axis MARG sensors with rate-limited, evidence-gated corrections.
paragraph=ARBITER fuses gyroscope, accelerometer, and magnetometer data into a quaternion. Vector-sensor corrections pass consistency tests and spend a rotation budget that refills at the expected gyroscope drift rate, which bounds the influence of dynamic acceleration and magnetic disturbances by construction. Float32, no dynamic memory, about 270 FLOPs per step.
